name: BlackwattleHomeKitBridge
options:
  bundleIdPrefix: ad.blackwattle
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BlackwattleHomeKitBridge:
    type: application
    platform: iOS
    attributes:
      UIKitCatalyst: optimized
    sources:
      - path: Sources/BlackwattleHomeKitBridge
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: $(HOMEKIT_DEVELOPMENT_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: ad.blackwattle.homekit
        PRODUCT_NAME: HomeKit Bridge
        TARGETED_DEVICE_FAMILY: "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BlackwattleHomeKitBridge.entitlements
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
        Release:
          ENABLE_APP_SANDBOX: YES
          ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
    entitlements:
      path: Resources/BlackwattleHomeKitBridge.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.security.application-groups:
          - group.ad.blackwattle.homekit
    dependencies:
      - sdk: HomeKit.framework

schemes:
  BlackwattleHomeKitBridge:
    build:
      targets:
        BlackwattleHomeKitBridge: all
    run:
      config: Debug
      executable: BlackwattleHomeKitBridge
    archive:
      config: Release
